<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Would You Rather Video Generator</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<main>
  <section class="panel hero">
    <p class="eyebrow">WYR VIDEO GENERATOR</p>
    <h1>Generate. Review. Done.</h1>
    <p class="lede">Groq creates the questions. Pixabay finds the visuals automatically, with Pexels as fallback. Review the 16 choices, replace only what you dislike, then render.</p>
    <button id="start">Create WYR</button>
  </section>

  <section id="review" class="review" hidden>
    <div class="review-head">
      <div>
        <p class="eyebrow">IMAGE REVIEW</p>
        <h2 id="topic"></h2>
        <p id="progress-label">0 of 16 images ready</p>
      </div>
      <button id="generate" disabled>Generate Video</button>
    </div>
    <div id="slots" class="review-grid"></div>
    <div class="sticky-status">
      <span id="sticky-progress">0 of 16 images ready</span>
      <button id="sticky-generate" disabled>Generate Video</button>
    </div>
  </section>

  <section id="status" class="panel" hidden aria-live="polite">
    <div class="status-row"><span id="stage"></span><span id="percent"></span></div>
    <progress id="bar" max="100" value="0"></progress>
  </section>

  <p id="error" class="error" hidden></p>

  <section id="result" class="result panel" hidden>
    <p class="eyebrow">VERIFIED OUTPUT</p>
    <h2 id="result-topic"></h2>
    <a id="download" class="button" download>Download MP4</a>
    <video id="video" controls playsinline></video>
  </section>
</main>
<script src="/app.js" type="module"></script>
</body>
</html>
