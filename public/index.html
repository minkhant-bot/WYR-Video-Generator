<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Would You Rather Video Generator</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<main>
  <section class="panel hero">
    <p class="eyebrow">WYR VIDEO GENERATOR</p>
    <h1>Generate. Automatically. Done.</h1>
    <p class="lede">Groq creates the questions. Pixabay finds and selects all 16 visuals automatically, with Pexels as fallback, then the video renders — no manual review needed.</p>
    <button id="start">Create WYR</button>
  </section>

  <section id="status" class="panel" hidden aria-live="polite">
    <div class="status-row"><span id="stage"></span><span id="percent"></span></div>
    <progress id="bar" max="100" value="0"></progress>
  </section>

  <p id="error" class="error" hidden></p>

  <section id="result" class="result panel" hidden>
    <p class="eyebrow">VERIFIED OUTPUT</p>
    <h2 id="result-topic"></h2>
    <a id="download" class="button" download>Download MP4</a>
    <video id="video" controls playsinline></video>
  </section>
</main>
<script src="/app.js" type="module"></script>
</body>
</html>
