<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Would You Rather Video Generator</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<main>
  <section class="panel hero">
    <p class="eyebrow">WYR VIDEO GENERATOR</p>
    <h1>Generate. Automatically. Done.</h1>
    <p class="lede">Groq creates the questions. Pixabay finds and selects all the visuals automatically, with Pexels as fallback, then the video renders — no manual review needed.</p>
    <button id="start">Create WYR</button>
  </section>

  <section id="status" class="panel" hidden aria-live="polite">
    <div class="status-row"><span id="stage"></span><span id="percent"></span></div>
    <progress id="bar" max="100" value="0"></progress>
  </section>

  <p id="error" class="error" hidden></p>

  <section id="result" class="result panel" hidden>
    <p class="eyebrow">VERIFIED OUTPUT</p>
    <h2 id="result-topic"></h2>
    <a id="download" class="button" download>Download MP4</a>
    <video id="video" controls playsinline></video>
  </section>

  <section id="pool-panel" class="panel pool-panel">
    <p class="eyebrow">CONTENT POOL</p>
    <div class="pool-stats">
      <div><span id="pool-ready">–</span><small>Ready</small></div>
      <div><span id="pool-total">–</span><small>Total</small></div>
    </div>
    <p id="pool-refill-status" class="pool-status">Status: unknown</p>
    <input id="pool-admin-token" type="password" placeholder="Admin token" autocomplete="off">
    <div class="pool-actions">
      <button id="pool-refresh" class="secondary" type="button">Refresh</button>
      <button id="pool-refill" type="button">Refill to 200</button>
    </div>
    <div class="pool-actions">
      <button id="pool-seed-static" class="secondary" type="button">Seed 220 Questions</button>
    </div>
    <div class="pool-import">
      <label for="pool-import-file" class="pool-import-label">Import JSON Questions</label>
      <input id="pool-import-file" type="file" accept="application/json,.json">
      <p id="pool-import-status" class="pool-status"></p>
    </div>
    <p id="pool-error" class="error" hidden></p>
  </section>
</main>
<script src="/app.js" type="module"></script>
</body>
</html>
